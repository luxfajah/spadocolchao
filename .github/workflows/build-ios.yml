name: Build iOS Apps (Sideloadable IPA)

on:
  push:
    branches: [ main ]
    paths:
      - 'ios-vendedor/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-vendedor:
    name: Compilar Spa Vendedor (iOS IPA)
    runs-on: macos-14

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Versão do Xcode
        run: |
          echo "Selecionando versão moderna do Xcode..."
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Compilar App para Dispositivo iOS (xcodebuild clean build)
        run: |
          xcodebuild clean build \
            -project ios-vendedor/SpaVendedor.xcodeproj \
            -scheme SpaVendedor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 📦 Empacotar Arquivo .IPA Limpo para Sideloadly
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/SpaVendedor.app Payload/
          zip -r -9 SpaVendedor.ipa Payload/
          echo "✅ .IPA gerado com sucesso:"
          ls -lh SpaVendedor.ipa

      - name: 🚀 Publicar Artefato (.IPA) no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SpaVendedor-iOS
          path: SpaVendedor.ipa
          retention-days: 30
